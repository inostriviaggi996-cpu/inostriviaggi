<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - I nostri viaggi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; background-color: #f4f6f7; color: #333; }
        .navbar { background: #2c3e50; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { color: white; font-weight: bold; font-size: 1.2rem; text-decoration: none; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background-color: #3498db; color: white; padding: 10px 18px; font-size: 1.2rem; border: none; border-radius: 4px; cursor: pointer; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: white; min-width: 200px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); border-radius: 4px; overflow: hidden; }
        .dropdown-content a { color: #333; padding: 12px 16px; text-decoration: none; display: block; font-size: 0.9rem; }
        .dropdown-content a:hover { background-color: #f1f1f1; }
        .dropdown:hover .dropdown-content { display: block; }

        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=1200') no-repeat center center/cover; height: calc(100vh - 62px); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 0 20px; }
        .hero h1 { font-size: 3.5rem; margin-bottom: 20px; text-shadow: 2px 2px 8px rgba(0,0,0,0.7); }
        .hero p { font-size: 1.4rem; margin-bottom: 40px; max-width: 600px; text-shadow: 1px 1px 4px rgba(0,0,0,0.7); }
        .btn-scopri { background: linear-gradient(135deg, #e67e22, #f39c12); color: white; padding: 18px 35px; font-size: 1.3rem; font-weight: bold; text-decoration: none; border-radius: 50px; box-shadow: 0 6px 15px rgba(230, 126, 34, 0.4); transition: all 0.3s ease; }
        .btn-scopri:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">✈️ I nostri viaggi</a>
        <div class="dropdown">

                <a href="index.html">Home</a>
                <a href="viaggi.html">Le Tappe</a>

                <a href="bacheca.html">Bacheca</a>

        </div>
    </nav>
    <header class="hero">
        <h1>I nostri viaggi</h1>
        <p>Benvenuti nel nostro spazio. Condividiamo foto, storie e piccoli dettagli delle nostre avventure in giro per il mondo.</p>
        <a href="viaggi.html" class="btn-scopri">Esplora le tappe ✨</a>
    </header>
</body>
</html>
