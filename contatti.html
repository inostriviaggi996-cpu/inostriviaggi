<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Hai domande o vuoi lasciarci un messaggio? Scrivici, saremo felici di risponderti.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrivici - I nostri viaggi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f7; }
        .navbar { background: #2c3e50; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { color: white; font-weight: bold; font-size: 1.2rem; text-decoration: none; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background-color: #3498db; color: white; padding: 10px 18px; font-size: 1.2rem; border: none; border-radius: 4px; cursor: pointer; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: white; min-width: 200px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); border-radius: 4px; }
        .dropdown-content a { color: #333; padding: 12px 16px; text-decoration: none; display: block; }
        .dropdown:hover .dropdown-content { display: block; }

        .container { max-width: 600px; margin: 50px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 20px; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        textarea { height: 150px; }
        .submit-btn { width: 100%; background: #e67e22; color: white; border: none; padding: 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #d35400; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">✈️ I nostri viaggi</a>
        <div class="dropdown">
            <button class="dropbtn">☰</button>
            <div class="dropdown-content">
                <a href="index.html">Home</a>
                <a href="viaggi.html">I Nostri Viaggi</a>
                <a href="indovina.html">Indovina dove andremo</a>
                <a href="bacheca.html">Bacheca</a>
                <a href="contatti.html">Scrivici</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <h2>✉️ Inviaci un messaggio privato</h2>
        <form action="https://formspree.io/f/mojzjrel" method="POST">
            <div class="form-group"><input type="text" name="name" placeholder="Il tuo Nome" required></div>
            <div class="form-group"><input type="email" name="_replyto" placeholder="La tua Email" required></div>
            <div class="form-group"><textarea name="message" placeholder="Scrivi qui il tuo messaggio..." required></textarea></div>
            <button type="submit" class="submit-btn">Invia Mail 🚀</button>
        </form>
    </div>
</body>
</html>
